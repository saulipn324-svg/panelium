name: panelium
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: panelium
      POSTGRES_USER: panelium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U panelium -d panelium"]
      interval: 5s
      timeout: 5s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [object-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
  backend:
    build: ./backend
    ports: ["127.0.0.1:8086:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/panelium
      DB_USER: panelium
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: panelium
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/actuator/health]
      interval: 10s
      timeout: 5s
      start_period: 50s
      retries: 12
  frontend:
    build: ./frontend
    environment:
      PANELIUM_API_URL: http://backend:8080
    ports: ["127.0.0.1:${FRONTEND_PORT:-3006}:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
volumes:
  postgres-data:
  object-data:
